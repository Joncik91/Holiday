<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Sunset over the Albufera lagoon near Valencia with reeds and a lateen sail boat">
  <defs>
    <linearGradient id="al-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4E86"/>
      <stop offset="0.24" stop-color="#8A5F86"/>
      <stop offset="0.46" stop-color="#D97A62"/>
      <stop offset="0.66" stop-color="#F0A55C"/>
      <stop offset="0.84" stop-color="#FBD189"/>
      <stop offset="1" stop-color="#FDE9B4"/>
    </linearGradient>
    <linearGradient id="al-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D398"/>
      <stop offset="0.18" stop-color="#E79C68"/>
      <stop offset="0.45" stop-color="#B96D6C"/>
      <stop offset="0.75" stop-color="#6B4A73"/>
      <stop offset="1" stop-color="#39335C"/>
    </linearGradient>
    <radialGradient id="al-sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF3CE" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#FFC873" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF9E5A" stop-opacity="0"/>
    </radialGradient>
    <filter id="al-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="31"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="al-soft"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="al-lake"><rect x="0" y="560" width="1600" height="440"/></clipPath>
    <g id="al-reed">
      <path d="M0 0 C-4 -70 -6 -130 -2 -186" stroke="#2A2A33" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="-2" cy="-198" rx="7" ry="20" fill="#2A2A33"/>
      <path d="M0 -40 C-26 -80 -40 -110 -44 -140" stroke="#2A2A33" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M0 -60 C24 -96 38 -122 42 -152" stroke="#2A2A33" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
      <g id="al-palm">
        <path d="M-3 0 l0 -46 l6 0 Z"/>
        <path d="M0 -48 C-26 -60 -50 -56 -66 -40 C-44 -52 -22 -54 -1 -46 Z"/>
        <path d="M0 -48 C24 -62 50 -58 68 -42 C46 -54 22 -56 1 -46 Z"/>
        <path d="M0 -50 C-14 -74 -34 -86 -54 -90 C-32 -78 -14 -64 -2 -46 Z"/>
        <path d="M0 -50 C14 -76 36 -88 56 -92 C34 -80 14 -66 2 -46 Z"/>
      </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#al-sky)"/>
  <circle cx="620" cy="556" r="330" fill="url(#al-sunglow)"/>
  <circle cx="620" cy="552" r="76" fill="#FFF6D9"/>

  <g opacity="0.55">
    <path d="M120 210 q160 -30 320 -6 q-140 34 -320 6 Z" fill="#6E5A8A"/>
    <path d="M1000 160 q220 -34 420 -4 q-200 40 -420 4 Z" fill="#7A5F8A"/>
    <path d="M300 330 q220 -30 420 -2 q-200 36 -420 2 Z" fill="#C97F76"/>
    <path d="M1060 372 q180 -26 340 0 q-170 32 -340 0 Z" fill="#D98F72"/>
  </g>

  <!-- far shore -->
  <g>
    <rect x="0" y="548" width="1600" height="16" fill="#2F2B40" opacity="0.5"/>
    <g fill="#2A2636" opacity="0.85">
      <rect x="0" y="536" width="1600" height="14"/>
      <path d="M180 536 l0 -26 l10 0 l0 26 Z"/>
      <path d="M1320 536 l0 -34 l10 0 l0 34 Z"/>
    </g>
    <g fill="#241F2E">
      <use href="#al-palm" x="240" y="538"/>
      <use href="#al-palm" x="286" y="538"/>
      <use href="#al-palm" x="1180" y="538"/>
      <use href="#al-palm" x="1420" y="538"/>
      <use href="#al-palm" x="1464" y="538"/>
    </g>
    <!-- barraca hut -->
    <g fill="#241F2E">
      <path d="M980 538 l0 -34 l84 0 l0 34 Z"/>
      <path d="M960 504 l64 -60 l64 60 Z"/>
    </g>
  </g>

  <!-- water -->
  <rect x="0" y="560" width="1600" height="440" fill="url(#al-water)"/>
  <g clip-path="url(#al-lake)" filter="url(#al-soft)">
    <g fill="#FFE9B8" opacity="0.85">
      <ellipse cx="620" cy="586" rx="60" ry="6"/>
      <ellipse cx="620" cy="616" rx="96" ry="7" opacity="0.85"/>
      <ellipse cx="612" cy="652" rx="130" ry="8" opacity="0.7"/>
      <ellipse cx="628" cy="694" rx="106" ry="7" opacity="0.6"/>
      <ellipse cx="608" cy="742" rx="160" ry="9" opacity="0.5"/>
      <ellipse cx="632" cy="798" rx="128" ry="8" opacity="0.4"/>
      <ellipse cx="614" cy="862" rx="196" ry="10" opacity="0.32"/>
      <ellipse cx="626" cy="936" rx="164" ry="9" opacity="0.25"/>
    </g>
    <g stroke="#FFD9A0" stroke-width="2.5" fill="none" opacity="0.28">
      <path d="M60 600 q50 -8 100 0 t100 0"/>
      <path d="M1080 622 q56 -9 112 0 t112 0"/>
      <path d="M180 700 q60 -10 120 0 t120 0"/>
      <path d="M1120 762 q64 -11 128 0 t128 0"/>
      <path d="M80 848 q70 -12 140 0 t140 0"/>
      <path d="M900 920 q76 -13 152 0 t152 0"/>
    </g>
  </g>

  <!-- boat with lateen sail -->
  <g transform="translate(1080 640)">
    <path d="M-70 0 C-44 26 44 26 70 0 Z" fill="#231E2C"/>
    <path d="M-2 -8 l0 -150" stroke="#231E2C" stroke-width="5"/>
    <path d="M-2 -156 L64 -14 L-2 -14 Z" fill="#2B2434"/>
    <path d="M-6 -134 L-58 -14 L-6 -14 Z" fill="#241F2E" opacity="0.85"/>
    <g opacity="0.4" transform="translate(0 52) scale(1 -1)" filter="url(#al-soft)">
      <path d="M-70 0 C-44 26 44 26 70 0 Z" fill="#231E2C"/>
      <path d="M-2 -156 L64 -14 L-2 -14 Z" fill="#2B2434"/>
    </g>
  </g>

  <!-- second distant boat -->
  <g transform="translate(330 604) scale(0.5)" opacity="0.7">
    <path d="M-70 0 C-44 26 44 26 70 0 Z" fill="#231E2C"/>
    <path d="M-2 -8 l0 -140" stroke="#231E2C" stroke-width="6"/>
    <path d="M-2 -146 L58 -14 L-2 -14 Z" fill="#2B2434"/>
  </g>

  <!-- birds -->
  <g stroke="#3B3348" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M340 250 q18 -16 36 0"/><path d="M376 250 q18 -16 36 0"/>
    <path d="M430 300 q14 -12 28 0"/><path d="M458 300 q14 -12 28 0"/>
    <path d="M1200 226 q16 -14 32 0"/><path d="M1232 226 q16 -14 32 0"/>
  </g>

  <!-- foreground reeds -->
  <g>
    <use href="#al-reed" x="60" y="1000"/>
    <use href="#al-reed" x="110" y="1010" transform="scale(1.1) translate(0 -80)"/>
    <use href="#al-reed" x="176" y="1000"/>
    <use href="#al-reed" x="228" y="990"/>
    <use href="#al-reed" x="1400" y="1000"/>
    <use href="#al-reed" x="1452" y="1010"/>
    <use href="#al-reed" x="1510" y="994"/>
    <use href="#al-reed" x="1560" y="1004"/>
    <use href="#al-reed" x="1330" y="1006"/>
  </g>
  <path d="M0 1000 C120 940 260 946 340 986 L340 1000 Z" fill="#231E2C" opacity="0.8"/>
  <path d="M1600 1000 C1460 936 1320 944 1240 990 L1240 1000 Z" fill="#231E2C" opacity="0.8"/>

  <g opacity="0.17" filter="url(#al-grain)"><rect width="1600" height="1000"/></g>
</svg>
