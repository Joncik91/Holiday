<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="A hidden Mediterranean cove with turquoise water, pale cliffs and a small boat">
  <defs>
    <linearGradient id="cl-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E7FB0"/>
      <stop offset="0.5" stop-color="#82BFDA"/>
      <stop offset="1" stop-color="#D9EDF0"/>
    </linearGradient>
    <linearGradient id="cl-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E5F86"/>
      <stop offset="0.28" stop-color="#128CA0"/>
      <stop offset="0.62" stop-color="#37B7AE"/>
      <stop offset="1" stop-color="#9FE0D0"/>
    </linearGradient>
    <linearGradient id="cl-cliff" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#EADFCE"/>
      <stop offset="0.5" stop-color="#CBB9A2"/>
      <stop offset="1" stop-color="#9C8871"/>
    </linearGradient>
    <linearGradient id="cl-cliff2" x1="1" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F2E8D8"/>
      <stop offset="1" stop-color="#B6A28B"/>
    </linearGradient>
    <linearGradient id="cl-sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4E3C6"/>
      <stop offset="1" stop-color="#E0C79E"/>
    </linearGradient>
    <filter id="cl-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="cl-soft"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="cl-water"><path d="M0 372 L1600 372 L1600 1000 L0 1000 Z"/></clipPath>
      <g id="cl-pine">
      <path d="M0 0 l-4 -26 l8 0 Z"/>
      <ellipse cx="0" cy="-32" rx="26" ry="12"/>
      <ellipse cx="-10" cy="-42" rx="16" ry="9"/>
      <ellipse cx="12" cy="-40" rx="14" ry="8"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#cl-sky)"/>
  <circle cx="300" cy="150" r="58" fill="#FFF7E2" opacity="0.85"/>
  <g fill="#FFFFFF" opacity="0.5">
    <ellipse cx="1180" cy="150" rx="190" ry="30"/>
    <ellipse cx="1290" cy="122" rx="120" ry="20"/>
    <ellipse cx="620" cy="112" rx="130" ry="18"/>
  </g>

  <rect x="0" y="372" width="1600" height="628" fill="url(#cl-sea)"/>

  <!-- sea texture -->
  <g clip-path="url(#cl-water)" stroke="#E9FBF4" fill="none" opacity="0.3">
    <path d="M40 430 q40 -8 80 0 t80 0" stroke-width="3"/>
    <path d="M420 466 q46 -9 92 0 t92 0" stroke-width="3"/>
    <path d="M980 442 q40 -8 80 0 t80 0" stroke-width="3"/>
    <path d="M1240 508 q50 -10 100 0 t100 0" stroke-width="4"/>
    <path d="M160 566 q56 -11 112 0 t112 0" stroke-width="4"/>
    <path d="M760 620 q60 -12 120 0 t120 0" stroke-width="4"/>
    <path d="M300 690 q66 -13 132 0 t132 0" stroke-width="5"/>
    <path d="M1050 742 q70 -14 140 0 t140 0" stroke-width="5"/>
  </g>
  <g clip-path="url(#cl-water)" opacity="0.35" filter="url(#cl-soft)">
    <ellipse cx="300" cy="460" rx="52" ry="7" fill="#FFF9E4"/>
    <ellipse cx="300" cy="520" rx="78" ry="8" fill="#FFF9E4" opacity="0.8"/>
    <ellipse cx="300" cy="596" rx="110" ry="9" fill="#FFF9E4" opacity="0.6"/>
  </g>

  <!-- headland right -->
  <g>
    <path d="M1130 372 C1210 330 1290 316 1380 322 C1470 328 1540 356 1600 396 L1600 720 C1520 690 1430 646 1360 596 C1268 530 1180 452 1130 372 Z" fill="url(#cl-cliff2)"/>
    <path d="M1330 342 C1400 348 1470 372 1530 406 C1470 392 1400 386 1330 392 Z" fill="#FFFBF2" opacity="0.55"/>
    <path d="M1600 720 C1520 690 1430 646 1360 596 C1420 616 1512 646 1600 664 Z" fill="#7E6A55" opacity="0.35"/>
  </g>
  <!-- pines on headland -->
  <g fill="#2C4E3A">
    
    <use href="#cl-pine" x="1290" y="352"/>
    <use href="#cl-pine" x="1372" y="336"/>
    <use href="#cl-pine" x="1450" y="348"/>
    <use href="#cl-pine" x="1540" y="366"/>
  </g>

  <!-- headland left -->
  <path d="M0 372 C70 350 140 348 210 366 C150 420 80 470 0 508 Z" fill="url(#cl-cliff)"/>

  <!-- beach -->
  <path d="M0 828 C160 786 340 762 520 764 C700 766 860 792 1000 836 C1120 872 1180 918 1200 1000 L0 1000 Z" fill="url(#cl-sand)"/>
  <path d="M0 828 C160 786 340 762 520 764 C700 766 860 792 1000 836 C900 828 760 826 620 838 C420 856 200 856 0 848 Z" fill="#FFFFFF" opacity="0.55"/>
  <path d="M0 852 C180 866 400 866 600 850 C760 838 900 838 1010 852 C900 848 760 856 620 872 C420 894 200 892 0 880 Z" fill="#FFFFFF" opacity="0.35"/>

  <!-- boat -->
  <g transform="translate(1010 604)">
    <path d="M-64 0 C-40 24 40 24 64 0 Z" fill="#F7F2E7"/>
    <path d="M-64 0 C-40 24 40 24 64 0 Z" fill="#C2452E" opacity="0.25"/>
    <rect x="-2" y="-72" width="4" height="72" fill="#8A6A4A"/>
    <path d="M2 -70 C34 -50 44 -26 46 -6 L2 -6 Z" fill="#FFFDF6"/>
    <path d="M-4 -62 C-26 -44 -34 -24 -36 -6 L-4 -6 Z" fill="#F0E6D4"/>
    <ellipse cx="0" cy="16" rx="72" ry="7" fill="#0B5872" opacity="0.3"/>
  </g>

  <!-- parasol + towels on beach -->
  <g transform="translate(430 880)">
    <rect x="-2" y="-96" width="5" height="96" fill="#8A6A4A"/>
    <path d="M-86 -92 C-60 -134 60 -134 86 -92 Z" fill="#E4E1D6"/>
    <path d="M-86 -92 C-70 -122 -34 -134 -2 -134 L-2 -92 Z" fill="#C2452E"/>
    <path d="M40 -132 C64 -122 78 -108 86 -92 L44 -92 Z" fill="#C2452E" opacity="0.85"/>
    <ellipse cx="0" cy="4" rx="96" ry="12" fill="#C6A87C" opacity="0.45"/>
  </g>
  <g opacity="0.9">
    <rect x="600" y="900" width="150" height="34" rx="8" fill="#E9E2D2" transform="rotate(-4 675 917)"/>
    <rect x="620" y="946" width="150" height="34" rx="8" fill="#DCC7A6" transform="rotate(3 695 963)"/>
  </g>

  <!-- birds -->
  <g stroke="#2C4E5E" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M700 200 q16 -14 32 0"/><path d="M732 200 q16 -14 32 0"/>
    <path d="M820 250 q12 -10 24 0"/><path d="M844 250 q12 -10 24 0"/>
  </g>

  <g opacity="0.15" filter="url(#cl-grain)"><rect width="1600" height="1000"/></g>
</svg>
