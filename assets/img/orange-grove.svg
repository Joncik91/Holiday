<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Rows of orange trees under a warm Valencian sun with a distant sierra">
  <defs>
    <linearGradient id="og-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FB8D6"/>
      <stop offset="0.45" stop-color="#BEDCE4"/>
      <stop offset="0.8" stop-color="#F3DFC0"/>
      <stop offset="1" stop-color="#F8E9CF"/>
    </linearGradient>
    <linearGradient id="og-soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C98F5E"/>
      <stop offset="0.5" stop-color="#B97C4D"/>
      <stop offset="1" stop-color="#96603A"/>
    </linearGradient>
    <linearGradient id="og-leaf" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#4E7A46"/>
      <stop offset="0.55" stop-color="#33603C"/>
      <stop offset="1" stop-color="#1F452C"/>
    </linearGradient>
    <linearGradient id="og-leaf2" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#6E9756"/>
      <stop offset="1" stop-color="#3B6A3E"/>
    </linearGradient>
    <radialGradient id="og-haze" cx="0.72" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#FFF0CE" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFF0CE" stop-opacity="0"/>
    </radialGradient>
    <filter id="og-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="og-blur"><feGaussianBlur stdDeviation="6"/></filter>
      <g id="og-tree-m">
      <path d="M-6 0 l0 -44 l12 0 l0 44 Z" fill="#6B4A2F"/>
      <circle cx="0" cy="-86" r="56" fill="url(#og-leaf)"/>
      <circle cx="-34" cy="-66" r="38" fill="url(#og-leaf2)"/>
      <circle cx="36" cy="-70" r="40" fill="url(#og-leaf2)"/>
      <circle cx="4" cy="-118" r="36" fill="url(#og-leaf2)"/>
      <g fill="#F2913A"><circle cx="-30" cy="-92" r="7"/><circle cx="18" cy="-108" r="6"/><circle cx="40" cy="-60" r="7"/><circle cx="-8" cy="-52" r="6"/><circle cx="-48" cy="-52" r="5"/></g>
    </g>
    <g id="og-tree-f">
      <path d="M-12 0 C-10 -40 -12 -70 -6 -96 l16 0 C4 -70 6 -40 12 0 Z" fill="#5C3D26"/>
      <circle cx="0" cy="-170" r="96" fill="url(#og-leaf)"/>
      <circle cx="-64" cy="-136" r="66" fill="url(#og-leaf2)"/>
      <circle cx="68" cy="-142" r="70" fill="url(#og-leaf2)"/>
      <circle cx="6" cy="-232" r="62" fill="url(#og-leaf2)"/>
      <circle cx="-30" cy="-208" r="48" fill="url(#og-leaf)" opacity="0.7"/>
      <g fill="#F0872F">
        <circle cx="-58" cy="-182" r="13"/><circle cx="26" cy="-212" r="12"/><circle cx="74" cy="-124" r="13"/>
        <circle cx="-12" cy="-104" r="11"/><circle cx="-92" cy="-124" r="11"/><circle cx="52" cy="-186" r="10"/>
        <circle cx="8" cy="-262" r="10"/>
      </g>
      <g fill="#FFB25A" opacity="0.85">
        <circle cx="-54" cy="-186" r="4"/><circle cx="30" cy="-216" r="4"/><circle cx="78" cy="-128" r="4"/>
      </g>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#og-sky)"/>
  <rect width="1600" height="1000" fill="url(#og-haze)"/>
  <circle cx="1160" cy="230" r="70" fill="#FFF6DE" opacity="0.9"/>

  <!-- sierra -->
  <g filter="url(#og-blur)" opacity="0.55">
    <path d="M0 470 L150 402 L268 448 L400 366 L540 452 L640 414 L760 470 L900 396 L1030 460 L1180 400 L1320 462 L1450 414 L1600 468 L1600 540 L0 540 Z" fill="#8AA0AE"/>
  </g>
  <path d="M0 496 L180 452 L320 486 L470 436 L620 492 L780 452 L930 500 L1100 448 L1260 498 L1420 456 L1600 500 L1600 560 L0 560 Z" fill="#7C8E86" opacity="0.6"/>

  <!-- fields -->
  <rect x="0" y="540" width="1600" height="460" fill="url(#og-soil)"/>
  <g opacity="0.35" fill="#8A5733">
    <path d="M0 640 L1600 604 L1600 620 L0 660 Z"/>
    <path d="M0 742 L1600 686 L1600 708 L0 770 Z"/>
    <path d="M0 880 L1600 792 L1600 822 L0 916 Z"/>
  </g>
  <g opacity="0.25" fill="#E4B27E">
    <path d="M0 604 L1600 574 L1600 582 L0 616 Z"/>
    <path d="M0 700 L1600 650 L1600 662 L0 716 Z"/>
    <path d="M0 826 L1600 748 L1600 766 L0 848 Z"/>
  </g>

  <!-- distant tree row -->
  <g opacity="0.5">
    <g fill="#4A6E4A">
      <circle cx="80" cy="540" r="30"/><circle cx="200" cy="536" r="28"/><circle cx="320" cy="542" r="31"/>
      <circle cx="440" cy="534" r="27"/><circle cx="560" cy="540" r="30"/><circle cx="680" cy="536" r="28"/>
      <circle cx="800" cy="542" r="31"/><circle cx="920" cy="534" r="27"/><circle cx="1040" cy="540" r="30"/>
      <circle cx="1160" cy="536" r="28"/><circle cx="1280" cy="542" r="31"/><circle cx="1400" cy="534" r="27"/>
      <circle cx="1520" cy="540" r="30"/>
    </g>
  </g>

  <!-- middle tree row -->
  <g>
    
    <use href="#og-tree-m" x="120" y="646"/>
    <use href="#og-tree-m" x="400" y="652"/>
    <use href="#og-tree-m" x="690" y="644"/>
    <use href="#og-tree-m" x="980" y="654"/>
    <use href="#og-tree-m" x="1270" y="646"/>
    <use href="#og-tree-m" x="1540" y="650"/>
  </g>

  <!-- foreground trees -->
  <g>
    
    <use href="#og-tree-f" x="230" y="882"/>
    <use href="#og-tree-f" x="800" y="906"/>
    <use href="#og-tree-f" x="1380" y="888"/>
  </g>

  <!-- fallen fruit -->
  <g fill="#E87D2C" opacity="0.9">
    <circle cx="330" cy="944" r="10"/><circle cx="368" cy="962" r="9"/><circle cx="880" cy="968" r="10"/>
    <circle cx="1284" cy="950" r="9"/><circle cx="1240" cy="972" r="8"/>
  </g>

  <g opacity="0.16" filter="url(#og-grain)"><rect width="1600" height="1000"/></g>
</svg>
