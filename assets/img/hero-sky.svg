    <g fill="#FFEBC0">
      <ellipse cx="1120" cy="636" rx="54" ry="6" opacity="0.9"/>
      <ellipse cx="1116" cy="662" rx="86" ry="7" opacity="0.75"/>
      <ellipse cx="1126" cy="694" rx="118" ry="8" opacity="0.6"/>
      <ellipse cx="1110" cy="732" rx="96" ry="7" opacity="0.5"/>
      <ellipse cx="1130" cy="776" rx="150" ry="9" opacity="0.4"/>
      <ellipse cx="1112" cy="826" rx="120" ry="8" opacity="0.3"/>
      <ellipse cx="1128" cy="880" rx="180" ry="9" opacity="0.22"/>
    </g>
    <g stroke="#FFD8A2" stroke-width="2.5" fill="none" opacity="0.24">
      <path d="M80 650 q46 -8 92 0 t92 0"/>
