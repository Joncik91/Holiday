<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="A paella pan seen from above on a rustic table, with lemon, prawns and mussels">
  <defs>
    <linearGradient id="pa-table" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#7C5B41"/>
      <stop offset="0.5" stop-color="#6A4B35"/>
      <stop offset="1" stop-color="#523829"/>
    </linearGradient>
    <radialGradient id="pa-rice" cx="0.42" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#F5C55C"/>
      <stop offset="0.55" stop-color="#E3A63C"/>
      <stop offset="1" stop-color="#B87423"/>
    </radialGradient>
    <linearGradient id="pa-pan" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#4A4741"/>
      <stop offset="0.5" stop-color="#332F2B"/>
      <stop offset="1" stop-color="#1D1A17"/>
    </linearGradient>
    <radialGradient id="pa-light" cx="0.4" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#FFE9BC" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFE9BC" stop-opacity="0"/>
    </radialGradient>
    <filter id="pa-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="19"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="pa-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="pa-clip"><circle cx="800" cy="500" r="330"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="url(#pa-table)"/>
  <g opacity="0.22" stroke="#3A2718" stroke-width="3">
    <path d="M0 130 H1600"/><path d="M0 300 H1600"/><path d="M0 470 H1600"/>
    <path d="M0 640 H1600"/><path d="M0 810 H1600"/><path d="M0 960 H1600"/>
  </g>
  <g opacity="0.13" stroke="#E5C79E" stroke-width="1.5">
    <path d="M0 176 H1600"/><path d="M0 352 H1600"/><path d="M0 524 H1600"/>
    <path d="M0 700 H1600"/><path d="M0 866 H1600"/>
  </g>
  <rect width="1600" height="1000" fill="url(#pa-light)"/>

  <!-- linen napkin -->
  <g transform="rotate(-8 250 800)">
    <rect x="60" y="700" width="330" height="230" rx="6" fill="#EDE4D3"/>
    <rect x="60" y="700" width="330" height="230" rx="6" fill="none" stroke="#D8CBB4" stroke-width="3"/>
    <rect x="60" y="742" width="330" height="10" fill="#C2452E" opacity="0.8"/>
    <rect x="60" y="878" width="330" height="10" fill="#C2452E" opacity="0.8"/>
  </g>

  <!-- pan shadow -->
  <ellipse cx="812" cy="524" rx="352" ry="336" fill="#1B120B" opacity="0.55" filter="url(#pa-shadow)"/>

  <!-- pan -->
  <circle cx="800" cy="500" r="352" fill="url(#pa-pan)"/>
  <circle cx="800" cy="500" r="352" fill="none" stroke="#57524A" stroke-width="6" opacity="0.6"/>
  <circle cx="800" cy="500" r="332" fill="#2A2723"/>
  <!-- handles -->
  <g fill="#3B3733">
    <path d="M436 470 h-92 a14 14 0 0 0 0 60 h92 Z"/>
    <path d="M1164 470 h92 a14 14 0 0 1 0 60 h-92 Z"/>
  </g>

  <!-- rice -->
  <circle cx="800" cy="500" r="330" fill="url(#pa-rice)"/>
  <g clip-path="url(#pa-clip)" opacity="0.5">
    <g fill="#C98A2C">
      <ellipse cx="620" cy="360" rx="120" ry="70"/>
      <ellipse cx="960" cy="640" rx="150" ry="90"/>
      <ellipse cx="700" cy="700" rx="110" ry="60"/>
      <ellipse cx="1000" cy="330" rx="90" ry="60"/>
    </g>
    <g fill="#F7D479" opacity="0.6">
      <ellipse cx="720" cy="440" rx="100" ry="56"/>
      <ellipse cx="900" cy="560" rx="80" ry="48"/>
    </g>
  </g>
  <!-- rice grain texture -->
  <g clip-path="url(#pa-clip)" opacity="0.45" fill="#FBEBC0">
    <g id="pa-grains">
      <ellipse cx="560" cy="420" rx="9" ry="4" transform="rotate(24 560 420)"/>
      <ellipse cx="620" cy="470" rx="9" ry="4" transform="rotate(-40 620 470)"/>
      <ellipse cx="700" cy="400" rx="9" ry="4" transform="rotate(65 700 400)"/>
      <ellipse cx="760" cy="520" rx="9" ry="4" transform="rotate(10 760 520)"/>
      <ellipse cx="840" cy="440" rx="9" ry="4" transform="rotate(-22 840 440)"/>
      <ellipse cx="900" cy="520" rx="9" ry="4" transform="rotate(48 900 520)"/>
      <ellipse cx="980" cy="470" rx="9" ry="4" transform="rotate(-64 980 470)"/>
      <ellipse cx="660" cy="600" rx="9" ry="4" transform="rotate(33 660 600)"/>
      <ellipse cx="780" cy="660" rx="9" ry="4" transform="rotate(-15 780 660)"/>
      <ellipse cx="900" cy="700" rx="9" ry="4" transform="rotate(72 900 700)"/>
      <ellipse cx="1040" cy="600" rx="9" ry="4" transform="rotate(-48 1040 600)"/>
      <ellipse cx="560" cy="640" rx="9" ry="4" transform="rotate(18 560 640)"/>
    </g>
    <use href="#pa-grains" x="40" y="-120"/>
    <use href="#pa-grains" x="-70" y="90"/>
    <use href="#pa-grains" x="110" y="140"/>
    <use href="#pa-grains" x="-30" y="-200"/>
    <use href="#pa-grains" x="150" y="-40"/>
  </g>

  <!-- green beans + peppers -->
  <g clip-path="url(#pa-clip)">
    <g stroke="#4C7A33" stroke-width="13" stroke-linecap="round" fill="none">
      <path d="M600 640 q60 -22 120 -6"/>
      <path d="M880 400 q64 18 118 4"/>
      <path d="M660 340 q50 34 96 40"/>
      <path d="M940 690 q56 -30 112 -22"/>
    </g>
    <g fill="#C0331F">
      <path d="M540 520 q54 -16 96 6 q-46 22 -96 -6 Z"/>
      <path d="M1010 470 q56 -18 100 4 q-48 24 -100 -4 Z"/>
      <path d="M760 750 q56 -18 100 4 q-48 24 -100 -4 Z"/>
    </g>
  </g>

  <!-- prawns -->
  <g clip-path="url(#pa-clip)">
    <g id="pa-prawn">
      <path d="M0 0 C46 -34 108 -22 128 22 C142 54 120 92 86 96 C110 74 112 44 92 24 C64 -4 26 -6 0 12 Z" fill="#E8623C"/>
      <path d="M0 0 C40 -28 96 -20 114 20 C126 48 108 80 80 84 C98 66 100 42 84 26 C60 4 26 4 4 18 Z" fill="#F58154"/>
      <circle cx="10" cy="6" r="5" fill="#3A140C"/>
      <path d="M0 2 l-30 -16 M0 8 l-32 4 M2 14 l-26 18" stroke="#E8623C" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <use href="#pa-prawn" transform="translate(600 470) rotate(-24) scale(1.05)"/>
    <use href="#pa-prawn" transform="translate(880 560) rotate(140) scale(1.15)"/>
    <use href="#pa-prawn" transform="translate(960 380) rotate(38) scale(0.95)"/>
  </g>

  <!-- mussels -->
  <g clip-path="url(#pa-clip)">
    <g id="pa-mussel">
      <path d="M0 0 C34 -30 84 -30 108 -4 C80 26 30 30 0 0 Z" fill="#2C2438"/>
      <path d="M6 -2 C36 -26 78 -26 98 -6 C74 16 32 20 6 -2 Z" fill="#E9A97F"/>
      <path d="M18 -6 C42 -22 72 -22 88 -8 C68 6 38 8 18 -6 Z" fill="#F2C79E"/>
    </g>
    <use href="#pa-mussel" transform="translate(690 690) rotate(-12)"/>
    <use href="#pa-mussel" transform="translate(940 700) rotate(24)"/>
    <use href="#pa-mussel" transform="translate(560 570) rotate(160)"/>
    <use href="#pa-mussel" transform="translate(1020 560) rotate(-150)"/>
  </g>

  <!-- lemon wedges -->
  <g clip-path="url(#pa-clip)">
    <g id="pa-lemon">
      <path d="M0 0 A96 96 0 0 1 -96 0 Z" fill="#F6D64A"/>
      <path d="M-6 -4 A84 84 0 0 1 -84 -4 Z" fill="#FBEC9A"/>
      <g stroke="#F1D054" stroke-width="4">
        <path d="M-45 -4 L-45 -78"/><path d="M-45 -4 L-14 -66"/><path d="M-45 -4 L-76 -66"/>
      </g>
    </g>
    <use href="#pa-lemon" transform="translate(760 800) rotate(-6) scale(0.86)"/>
    <use href="#pa-lemon" transform="translate(1080 640) rotate(-118) scale(0.78)"/>
    <use href="#pa-lemon" transform="translate(540 380) rotate(68) scale(0.72)"/>
  </g>

  <!-- rosemary sprig -->
  <g transform="translate(1290 780) rotate(18)" stroke="#3E6B3A" fill="none" stroke-linecap="round">
    <path d="M0 0 L190 -60" stroke-width="6"/>
    <g stroke-width="5">
      <path d="M30 -10 l-16 -26"/><path d="M56 -18 l-14 -28"/><path d="M84 -28 l-14 -26"/><path d="M112 -36 l-12 -28"/>
      <path d="M140 -46 l-12 -26"/><path d="M40 -12 l-8 28"/><path d="M68 -22 l-8 28"/><path d="M96 -30 l-8 28"/><path d="M124 -40 l-8 28"/>
    </g>
  </g>

  <g opacity="0.18" filter="url(#pa-grain)"><rect width="1600" height="1000"/></g>
</svg>
