<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="The City of Arts and Sciences in Valencia at dusk, white curved shells reflected in a turquoise pool">
  <defs>
    <linearGradient id="va-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123B5E"/>
      <stop offset="0.38" stop-color="#3E6E8E"/>
      <stop offset="0.66" stop-color="#B98A79"/>
      <stop offset="0.86" stop-color="#E8A97A"/>
      <stop offset="1" stop-color="#F4CE9E"/>
    </linearGradient>
    <radialGradient id="va-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD9A0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFD9A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="va-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E8F96"/>
      <stop offset="0.5" stop-color="#1E6E7E"/>
      <stop offset="1" stop-color="#14495A"/>
    </linearGradient>
    <linearGradient id="va-shell" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="0.55" stop-color="#F0E6DA"/>
      <stop offset="1" stop-color="#CBBBAE"/>
    </linearGradient>
    <linearGradient id="va-shell2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF4EA"/>
      <stop offset="1" stop-color="#BFAE9F"/>
    </linearGradient>
    <filter id="va-blur"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="va-soft"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="va-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="va-pool"><rect x="0" y="640" width="1600" height="360"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="url(#va-sky)"/>
  <circle cx="1230" cy="600" r="260" fill="url(#va-glow)"/>
  <circle cx="1230" cy="608" r="46" fill="#FFE9C4" opacity="0.9"/>

  <!-- distant clouds -->
  <g opacity="0.35" fill="#F6D8BE">
    <ellipse cx="330" cy="250" rx="210" ry="26"/>
    <ellipse cx="470" cy="212" rx="140" ry="17"/>
    <ellipse cx="1180" cy="320" rx="250" ry="22"/>
    <ellipse cx="980" cy="176" rx="170" ry="15"/>
  </g>

  <!-- far skyline -->
  <g fill="#20465F" opacity="0.55">
    <rect x="0" y="586" width="1600" height="60"/>
    <rect x="60" y="540" width="34" height="60"/><rect x="112" y="556" width="26" height="44"/>
    <rect x="1420" y="534" width="40" height="66"/><rect x="1490" y="552" width="28" height="48"/>
  </g>

  <!-- Palau de les Arts: the big helmet -->
  <g>
    <path d="M150 646 C168 520 288 424 452 424 C616 424 736 520 754 646 Z" fill="url(#va-shell2)"/>
    <path d="M186 646 C202 546 300 470 452 470 C604 470 702 546 718 646 Z" fill="#8FA7B4" opacity="0.35"/>
    <path d="M96 470 C240 336 470 300 660 372 C742 404 792 452 812 500 C744 452 660 428 566 430 C400 434 232 486 132 566 C112 528 100 498 96 470 Z" fill="url(#va-shell)"/>
    <path d="M96 470 C240 336 470 300 660 372 C700 388 732 408 756 430 C660 384 540 376 424 402 C296 430 186 500 118 574 C106 540 98 502 96 470 Z" fill="#FFFDF8" opacity="0.75"/>
  </g>

  <!-- L'Hemisferic: the eye -->
  <g transform="translate(880 0)">
    <ellipse cx="300" cy="596" rx="326" ry="86" fill="url(#va-shell)"/>
    <path d="M-26 596 C60 512 170 470 300 470 C430 470 540 512 626 596 Z" fill="#FBF6EE"/>
    <ellipse cx="300" cy="592" rx="212" ry="52" fill="#2A566B" opacity="0.55"/>
    <ellipse cx="300" cy="586" rx="150" ry="34" fill="#0F3648" opacity="0.5"/>
    <g stroke="#FFFDF8" stroke-width="3" opacity="0.8">
      <path d="M20 578 C110 512 200 486 300 486 C400 486 490 512 580 578"/>
      <path d="M62 596 C140 542 216 520 300 520 C384 520 460 542 538 596"/>
    </g>
  </g>

  <!-- Agora: pointed shell -->
  <path d="M760 646 C766 522 812 424 866 424 C920 424 966 522 972 646 Z" fill="url(#va-shell2)"/>
  <path d="M800 646 C806 552 838 476 866 476 C894 476 926 552 932 646 Z" fill="#7C93A2" opacity="0.3"/>

  <!-- pool -->
  <rect x="0" y="640" width="1600" height="360" fill="url(#va-water)"/>
  <g clip-path="url(#va-pool)" opacity="0.42" filter="url(#va-blur)">
    <g transform="translate(0 1292) scale(1 -1)">
      <path d="M150 646 C168 520 288 424 452 424 C616 424 736 520 754 646 Z" fill="#F3EAE0"/>
      <path d="M96 470 C240 336 470 300 660 372 C742 404 792 452 812 500 C744 452 660 428 566 430 C400 434 232 486 132 566 C112 528 100 498 96 470 Z" fill="#F3EAE0"/>
      <ellipse cx="1180" cy="596" rx="326" ry="86" fill="#EFE5D9"/>
      <path d="M760 646 C766 522 812 424 866 424 C920 424 966 522 972 646 Z" fill="#EFE5D9"/>
    </g>
  </g>
  <g clip-path="url(#va-pool)" opacity="0.5" filter="url(#va-soft)">
    <ellipse cx="1230" cy="700" rx="60" ry="8" fill="#FFE3B4"/>
    <ellipse cx="1230" cy="760" rx="90" ry="7" fill="#FFDCA6" opacity="0.7"/>
    <ellipse cx="1230" cy="830" rx="130" ry="8" fill="#FFD59A" opacity="0.5"/>
    <ellipse cx="1230" cy="912" rx="180" ry="9" fill="#FFCE8E" opacity="0.35"/>
  </g>
  <g stroke="#BFE6E4" stroke-width="2" opacity="0.28" fill="none">
    <path d="M60 706 q60 -10 120 0 t120 0 t120 0"/>
    <path d="M420 786 q70 -12 140 0 t140 0"/>
    <path d="M980 866 q80 -14 160 0 t160 0"/>
    <path d="M120 916 q80 -14 160 0 t160 0 t160 0"/>
  </g>

  <!-- palms -->
  <g fill="#0E2C3C">
    <g transform="translate(112 646)">
      <path d="M-5 0 C-9 -60 -12 -120 -6 -172 l12 0 C0 -120 3 -60 7 0 Z"/>
      <g opacity="0.95">
        <path d="M0 -176 C-52 -196 -96 -186 -128 -156 C-88 -172 -44 -176 -2 -166 Z"/>
        <path d="M0 -176 C48 -200 96 -192 130 -160 C90 -176 44 -180 2 -166 Z"/>
        <path d="M0 -178 C-30 -222 -68 -240 -104 -244 C-64 -228 -28 -204 -4 -170 Z"/>
        <path d="M0 -178 C28 -224 68 -244 106 -248 C66 -230 26 -206 4 -170 Z"/>
        <path d="M0 -180 C-8 -222 -4 -252 6 -276 C10 -244 8 -212 6 -172 Z"/>
      </g>
    </g>
    <g transform="translate(1516 646) scale(0.86)">
      <path d="M-5 0 C-9 -60 -12 -120 -6 -172 l12 0 C0 -120 3 -60 7 0 Z"/>
      <path d="M0 -176 C-52 -196 -96 -186 -128 -156 C-88 -172 -44 -176 -2 -166 Z"/>
      <path d="M0 -176 C48 -200 96 -192 130 -160 C90 -176 44 -180 2 -166 Z"/>
      <path d="M0 -178 C-30 -222 -68 -240 -104 -244 C-64 -228 -28 -204 -4 -170 Z"/>
      <path d="M0 -178 C28 -224 68 -244 106 -248 C66 -230 26 -206 4 -170 Z"/>
      <path d="M0 -180 C-8 -222 -4 -252 6 -276 C10 -244 8 -212 6 -172 Z"/>
    </g>
  </g>

  <g opacity="0.16" filter="url(#va-grain)"><rect width="1600" height="1000"/></g>
</svg>
