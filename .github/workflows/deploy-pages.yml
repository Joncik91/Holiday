name: Deploy to GitHub Pages

# Publishes the site whenever main changes.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions". The built-in
# GITHUB_TOKEN is not allowed to create a Pages site itself (configure-pages
# with enablement: true fails with "Resource not accessible by integration"),
# so that switch has to be flipped once by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
